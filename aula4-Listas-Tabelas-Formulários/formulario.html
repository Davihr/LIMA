<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
            <p><label>Nome:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p><label>Senha:</label>
                <input type="password" name="senha" required placeholder="Digite sua senha" maxlength="8">
            </p>
            <p><label>Telefone</label>
                <input type="text" name="telefone" required placeholder="Digite seu número de telefone" maxlength="15" pattern="\([0-9]{2}) [0-9]{5}-[0-9]{4}" title="Use o formato: (99) 99999-9999">
            </p>
            <p><label>E-mail:</label>
                <input type="email" name="email" required placeholder="Digite seu email">
            </p>
            <p><label>CEP:</label>
                <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="Digite seu CEP" required title="Use o formato: 00000-000">
            </p>
            <p><label>Sobre Você:</label>
                <textarea name="bio" rows="10" cols="100"></textarea>
            </p>
            <p><label>Gênero:</label>
                <input type="radio" name="genero" value="M">Masculino
                <input type="radio" name="genero" value="F">Feminino
            </p>
            <p><label>Interesses:</label>
                <input type="checkbox" name="interesses" value="tecnologia">Tecnologia
            <p><label>Interesses:</label>
                <input type="checkbox" name="interesses" value="esportes">Esportes
            <p><label>Interesses:</label>
                <input type="checkbox" name="interesses" value="artes">Artes
            </p>
            <p><label>País:</label>
                <select name="pais">
                    <option value="">---</option>
                    <option value="brasil">Brasil</option>
                    <option value="argentina">Argentina</option>
                    <option value="chile">Chile</option>
                </select>
            </p>
            <p><label>Foto de perfil:</label>
                <input type="file" name="foto">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </section>
</body>
</html>
