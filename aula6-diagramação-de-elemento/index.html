<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index.html</title>
    <style>
      .container {
        border: 5px solid black;
        width: 400px;
        height: 400px;
        text-align: center;
      }
      img {
        width: 100px;
        height: 100px;
        background-color: dodgerblue;
      }
      span {
        font-size: 20px;
        vertical-align: top;
      }
      .item1 {
        width: 150px;
        height: 150px;
        background-color: rgba(0, 0, 255);
        display: inline-block;
      }
      .item2 {
        width: 150px;
        height: 150px;
        background-color: rgba(255, 0, 0);
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Illum animi,
        vero ipsa veniam sequi, obcaecati consequatur saepe nobis necessitatibus
        ad dolores, cum corporis facilis eligendi nisi vel maiores iure
        molestias.
      </p>
      <button>Lorem</button>
      <div>
        <img />
        <span>Exemplo vertical-align</span>
      </div>

      <div class="item1">Item 1</div>
      <div class="item2">Item 2</div>
    </div>
  </body>
</html>
